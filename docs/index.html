<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13213c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vietlott">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Thống kê Vietlott</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-ball" aria-hidden="true"></span>Thống kê Vietlott</div>
    <div class="topbar-status" id="data-status"></div>
    <button type="button" class="btn btn-ghost-light" id="btn-update">Cập nhật<span class="hide-sm"> dữ liệu</span></button>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <nav class="game-list" id="game-list" aria-label="Loại xổ số"></nav>
      <nav class="section-nav" id="section-nav" aria-label="Mục"></nav>
    </aside>

    <main class="content" id="content" tabindex="-1">
      <div class="content-head">
        <div>
          <h1 id="page-title">Tổng quan</h1>
          <p class="page-sub" id="page-sub"></p>
        </div>
        <label class="scope" id="scope-wrap">
          <span>Phạm vi thống kê</span>
          <select id="scope"></select>
        </label>
      </div>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>
  </div>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="lib/jquery/dist/jquery.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/shim.js"></script>
  <script src="js/web/app.js"></script>
  <script src="js/web/sections.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        try { if (sessionStorage.getItem('vl_sw_reload')) return; sessionStorage.setItem('vl_sw_reload', '1'); } catch (e) {}
        location.reload();
      });
    }
  </script>
</body>
</html>
